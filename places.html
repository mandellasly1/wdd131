<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Temple homepage with gallery of city temples" />
  <meta name="author" content="Nelson Mandella Akpomah" />
  <title>Explore Nigeria</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/place.css" />
  <script src="scripts/place.js" defer></script>
</head>
<body>
  <header>
    <h1>Discover Nigeria</h1>
    <nav>
      <ul>
        <li><a href="#">Culture</a></li>
        <li><a href="#">Food</a></li>
        <li><a href="#">Nature</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <picture>
        <source srcset="images/nigeria-culture.webp" media="(min-width: 600px)" />
        <img src="images/nigeria-culture.jpg" alt="Scenic view of Nigeria" />
      </picture>
    </section>

    <section class="info">
      <h2>About Nigeria</h2>
      <p>Nigeria is a vibrant country in West Africa known for its rich culture, diverse landscapes, and energetic cities.</p>
    </section>

    <section class="weather">
      <h2>Weather <span class="weather-icon"></span></h2>
      <p>Temperature: <span id="temp">28</span>°C</p>
      <p>Wind Speed: <span id="speed">10</span> km/h</p>
      <p>Wind Chill: <span id="windchill">Calculating...</span></p>
    </section>

    
  </main>

  <footer>
    <p>&copy; <span id="year"></span> | Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
