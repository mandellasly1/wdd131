<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Name - Contact</title>
  <link rel="stylesheet" href="styles/reforms.css" />
  <script src="scripts/reforms.js" defer></script>
</head>
<body>
  <header>
    <h1>Company Name</h1>
    <img src="images/logo.png" alt="Company Logo" loading="lazy" />
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact">
      <h2>Contact Us</h2>
      <form id="contactForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" required />

        <label for="message">Message:</label>
        <textarea id="message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p><a href="references.html">References</a> | © 2025 Company Name</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
